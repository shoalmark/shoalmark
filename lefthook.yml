pre-commit:
  commands:
    python-syntax:
      glob: "*.py"
      run: |
        python3 - <<'PYTHON'
        import os
        import subprocess
        paths = subprocess.check_output([
            "git", "diff", "--cached", "--name-only", "--diff-filter=ACMR", "-z", "--", "*.py"
        ]).split(b"\0")
        count = 0
        for raw in filter(None, paths):
            path = os.fsdecode(raw)
            source = subprocess.check_output(["git", "show", ":" + path])
            compile(source, path, "exec")
            count += 1
        print(f"Python syntax: {count} staged files passed", flush=True)
        PYTHON
    core-tests:
      glob: "*.py"
      run: python3 -u test_core.py
    session:
      run: python3 shoalmark.py --session-check
    tracker-index:
      glob: "work-tracker/*.md"
      run: written=$(python3 shoalmark.py --print-written) && printf '%s\n' "$written" | git add --pathspec-from-file=-
prepare-commit-msg:
  commands:
    session:
      run: python3 shoalmark.py --session-trailer {1}
commit-msg:
  commands:
    judged:
      run: python3 shoalmark.py --commit-msg {1}
post-merge:
  commands:
    tracker-board:
      run: python3 shoalmark.py --html-only || true
