name: What your agent found · Was Ihr Agent gefunden hat
description: 'Tried it? Tell us what your agent found, even "no fit". One line is enough. · Ausprobiert? Sagen Sie uns, was Ihr Agent gefunden hat, auch „passt nicht“. Eine Zeile genügt.'
title: 'What my agent found · Was mein Agent gefunden hat'
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public, under your GitHub name. Leave out anything private:** names, paths, code and credentials. Your agent may have filled it in; you read it, change it and send it. The prompt never asks your agent to post.

        **Dieses Issue ist öffentlich, unter Ihrem GitHub-Namen. Lassen Sie Privates weg:** Namen, Pfade, Code und Zugangsdaten. Ihr Agent hat es vielleicht ausgefüllt; Sie lesen es, ändern es und senden es ab. Der Prompt bittet Ihren Agenten nie, etwas zu posten.
  - type: textarea
    id: found
    attributes:
      label: What your agent found · Was Ihr Agent gefunden hat
      description: 'One line is enough, and "no fit" is an answer too. · Eine Zeile genügt, und „passt nicht“ ist auch eine Antwort.'
    validations:
      required: true
