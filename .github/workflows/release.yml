# The release archive (FM-004, item 8). On a pushed tag: `shoalmark-<version>.zip` and its `.sha256`, built from the tag by
# scripts/build_release_archive.py — the build the suite's check runs — and uploaded to a draft release this workflow makes on the tag. The Owner checks
# the draft's two files, then publishes it: a published release is immutable here and takes no asset. By hand (workflow_dispatch), the dry run: it
# builds a tag or a commit and keeps the two files as the run's artifact, attaching nothing.
# The only workflow with write rights, on its uploading job alone; every action GitHub's own, pinned by its full commit. It never makes or moves a tag.
name: release
on:
  push: {tags: ["v*"]}
  workflow_dispatch:
    inputs:
      ref: {description: "a tag v<x.y.z>, or a 40-hex commit; anything else is refused before it reaches git", required: true, type: string}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    outputs: {version: "${{ steps.build.outputs.version }}"}
    steps:
      # the whole history and the tags, and no token kept in the checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: build
        name: The archive, from the tag or the dry run's input, which the script checks before it reaches git
        shell: bash
        env: {REF: "${{ github.event_name == 'push' && github.ref_name || inputs.ref }}"}
        run: |
          python3 scripts/build_release_archive.py --out dist -- "$REF"
          set -- dist/shoalmark-*.zip
          [ "$#" -eq 1 ] && [ -f "$1" ] && [ -f "$1.sha256" ] || { echo "::error::the build wrote no archive"; exit 1; }
          name=${1#dist/shoalmark-}
          echo "version=${name%.zip}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: {name: release-archive, path: dist/, if-no-files-found: error}
  draft:
    # a pushed tag only: the dry run attaches nothing
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    # one upload at a time for a tag, and an upload in flight is never cancelled
    concurrency: {group: "release-draft-${{ github.ref }}", cancel-in-progress: false}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: {name: release-archive, path: dist}
      - name: The draft — made on the tag, or github-actions[bot]'s own draft again; a published release, or a draft anyone else made, refuses
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", TAG: "${{ github.ref_name }}", VERSION: "${{ needs.build.outputs.version }}"}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$TAG" = "v$VERSION" ] || { echo "::error::the tag $TAG is not v$VERSION"; exit 1; }
          zip="dist/shoalmark-$VERSION.zip"
          [ -f "$zip" ] && [ -f "$zip.sha256" ] || { echo "::error::no $zip and its .sha256 from the build"; exit 1; }
          found=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == $ENV.TAG) | "\(.draft) \(.author.login)"')
          if [ -z "$found" ]; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""
            gh release upload "$TAG" "$zip" "$zip.sha256"
          elif [ "$found" = "true github-actions[bot]" ]; then
            gh release upload "$TAG" "$zip" "$zip.sha256" --clobber
          else
            echo "::error::$TAG already has a published release, or a draft github-actions[bot] did not make: nothing is attached"
            exit 1
          fi
