# The documentation site: built from docs/ on release tags or manual dispatch, served by GitHub Pages.
# The agents' document is README.md, rendered into the site by inclusion — never copied.
name: docs
# Runs on a release tag only — CI minutes are paid for. A pull request does not build the site; `zensical build` locally does.
on:
  push: {tags: ["v*"]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements-docs.txt
      - run: zensical build --clean
      - name: llms.txt — the agents' index of the same source, and a Markdown twin of every page
        run: python3 scripts/llms_txt.py site
      - run: python3 scripts/check_site.py site
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    # The public repository lives at shoalmark/shoalmark; keep private forks from deploying.
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
