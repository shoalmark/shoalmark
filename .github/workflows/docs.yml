# The documentation site: built from docs/ on release tags, by hand, and on pull requests that change it; served by GitHub Pages.
# The agents' document is README.md, rendered into the site by inclusion — never copied.
name: docs
# A change to the trackers alone does not start it.
on:
  push: {tags: ["v*"]}
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "overrides/**"
      - "launch/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "README.md"
      - "scripts/landing_facts.py"
      - "scripts/llms_txt.py"
      - "scripts/check_site.py"
      - "scripts/test_check_site.py"
      - ".github/workflows/docs.yml"
      - ".github/workflows/docs.worker.js"
      - ".github/workflows/docs.wrangler.jsonc"
# Each job names the permissions it needs, and no more; the workflow grants none of its own.
permissions: {}
# The image is pinned until 0.19.3, as ci.yml's are.
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: {contents: read, pull-requests: read}
    steps:
      # the whole history and its tags: the release, the wrecks' filing days and the pull requests' own commits are read from it
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements-docs.txt
      - run: python3 scripts/test_check_site.py
      # the release VERSION names: a tag's build and a run by hand only from a tagged release, a pull request's also ahead of it
      - name: the landing's figures and the probe prompt's pins, read from the repository at this commit
        run: python3 scripts/landing_facts.py --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF_NAME"
        env: {LANDING_FACTS_TOKEN: "${{ github.token }}"}
      - run: zensical build --clean
      - name: llms.txt — the agents' index of the same source, and a Markdown twin of every page
        run: python3 scripts/llms_txt.py site
      - run: python3 scripts/check_site.py site
      - name: the landing names the release this commit reads
        run: python3 scripts/landing_facts.py --check site --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF_NAME"
      - uses: actions/upload-pages-artifact@v5
        with: {path: site}
  deploy:
    # The public repository lives at shoalmark/shoalmark; keep private forks from deploying. A pull request never deploys.
    if: github.event.repository.private == false && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions: {pages: write, id-token: write}
    # one deployment at a time; a pull request's build is in no group, so it neither waits for a deployment nor cancels one
    concurrency: {group: pages, cancel-in-progress: false}
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  cloudflare:
    if: github.event.repository.private == false && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    concurrency: {group: cloudflare-worker, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/docs.wrangler.jsonc
            .github/workflows/docs.worker.js
      - uses: actions/download-artifact@v8
        with: {name: github-pages}
      - run: mkdir site && tar -xf artifact.tar -C site
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          command: deploy --config .github/workflows/docs.wrangler.jsonc
