name: ci
# Validate every non-draft PR revision and every release tag.
on:
  push: {tags: ["v*"]}
  pull_request: {types: [opened, synchronize, reopened, ready_for_review]}
  workflow_dispatch:
permissions: {contents: read}
# A new PR run cancels that PR's running run; tag and manual runs are not interrupted, but newer runs on the same ref can replace pending runs.
concurrency: {group: "ci-${{ github.event.pull_request.number || github.ref }}", cancel-in-progress: "${{ github.event_name == 'pull_request' }}"}
jobs:
  suites:
    name: suites (${{ matrix.system }}, ${{ matrix.python }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      # The images are pinned until 0.19.3; the check names carry the OS family only, so a pin never renames a check.
      matrix:
        include:
          - {system: ubuntu, image: ubuntu-24.04, python: "3.9", tz: Pacific/Kiritimati}
          - {system: ubuntu, image: ubuntu-24.04, python: "3.12", tz: Pacific/Pago_Pago}
          - {system: macos, image: macos-26, python: "3.12"}
          - {system: windows, image: windows-2025-vs2026, python: "3.9"}
          - {system: windows, image: windows-2025-vs2026, python: "3.12"}
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python }}"}
      - name: the tracker folder stays in its own repository
        id: tracker-path
        if: github.event_name == 'pull_request'
        shell: bash
        env: {BASE: "${{ github.event.pull_request.base.sha }}", HEAD_SHA: "${{ github.event.pull_request.head.sha }}"}
        run: |
          python - <<'PYTHON'
          import os
          import subprocess
          import sys
          added = subprocess.check_output([
              "git", "diff", "--no-renames", "--diff-filter=A", "--name-only", "-z",
              os.environ["BASE"], os.environ["HEAD_SHA"], "--",
          ]).split(b"\0")
          refused = [path for path in added if path.startswith(b"work-tracker/")]
          if refused:
              for path in refused:
                  print("Tracker path added to the code repository: " + repr(os.fsdecode(path)), file=sys.stderr)
              sys.exit(1)
          PYTHON
      - name: Subversion (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: sudo apt-get update -q && sudo apt-get install -y -q subversion
      - name: Subversion (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: brew install subversion
      - name: Subversion (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: |
          choco install sliksvn -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          echo "C:\Program Files\SlikSvn\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Subversion is really there — the S checks must run, not skip
        run: svn --version --quiet
      - name: git identity for the suites
        run: git config --global user.email ci@example.invalid && git config --global user.name ci && git config --global init.defaultBranch main
      - name: signers from the base
        id: suite-signers
        shell: bash
        env: {BASE: "${{ github.event.pull_request.base.sha || 'origin/main' }}"}
        run: |
          git rev-parse --verify "$BASE^{commit}" > /dev/null
          signers="$RUNNER_TEMP/shoalmark-allowed-signers"
          path=allowed_signers
          if ! git cat-file -e "$BASE:$path" 2>/dev/null; then
            # Remove this fallback once main holds allowed_signers at the top.
            path=work-tracker/allowed_signers
          fi
          if git cat-file -e "$BASE:$path" 2>/dev/null; then
            umask 077
            git show "$BASE:$path" > "$signers"
            git config gpg.ssh.allowedSignersFile "$signers"
            echo "SHOALMARK_SUITE_SIGNERS=$signers" >> "$GITHUB_ENV"
          else
            echo "The base has no signers file; no file is configured."
          fi
      - run: python -u test_shoalmark.py
      - run: python -u test_core.py
      # The additional time-zone runs report their results without changing the required result.
      - name: the suites under ${{ matrix.tz }} — reported, not yet required
        if: matrix.tz
        continue-on-error: true
        shell: bash
        env: {TZ: "${{ matrix.tz }}"}
        run: |
          python -u test_shoalmark.py && suite=0 || suite=$?
          python -u test_core.py && core=0 || core=$?
          if [ "$suite" -eq 0 ] && [ "$core" -eq 0 ]; then said="both suites passed"; else said="FAILED — test_shoalmark.py exit $suite, test_core.py exit $core"; fi
          echo "Under TZ=$TZ: $said (reported, not yet required)." >> "$GITHUB_STEP_SUMMARY"
          [ "$suite" -eq 0 ] && [ "$core" -eq 0 ]
