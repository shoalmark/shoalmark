name = "shoalmark"
owner = "holgoijo@gmail.com signed"   # the Owner, not a seat (FM-024): they answer with their key; at the top, before any table
tracker_dir = "work-tracker"       # the tracker; docs/ is the documentation site
triage_days = 7
freeze_at = 8        # the filing freeze (FM-032 S4, the Owner's `all four now`): at 8 open or more, only bug filings
judged_before_build = true   # FM-033, the Owner's rule: a pass judges before the first build commit — refused otherwise

[seats]            # who sits where — seats commit unsigned as <seat>@seat, and a seat's GitHub App shows its icon (README, *Seat icons on the forge*);
                   # the Owner is `owner` above, not a seat. A seat's value is a list: every identity in it is that seat, the old address first
owner = "holgoijo@gmail.com signed"   # the old spelling, the same as `owner` above: a copy older than D2 reads no Owner from the top line, so it stays until the open branches have merged main
planner = ["principal@seat", "336427458+shoalmark-planner[bot]@users.noreply.github.com"]   # `principal` is its former name, and its address stays: history resolves to this seat
builder = ["implementer@seat", "336429412+shoalmark-builder[bot]@users.noreply.github.com"]   # `implementer` is its former name
reviewer = ["reviewer@seat", "336429944+shoalmark-reviewer[bot]@users.noreply.github.com"]
research = ["research@seat", "datascientist@seat", "336434529+shoalmark-research[bot]@users.noreply.github.com"]   # the Data Scientist folded into research, 2026-09-30
go-to-market = ["go-to-market@seat", "gtm@seat", "336430483+shoalmark-go-to-market[bot]@users.noreply.github.com"]   # `gtm` was a seat of its own until this change: its address is this seat's
designer = ["designer@seat", "336431084+shoalmark-designer[bot]@users.noreply.github.com"]
auditor = ["auditor@seat", "336431811+shoalmark-auditor[bot]@users.noreply.github.com"]

[kinds]             # one id space, keyed by the project — an id encodes nothing that can change
FM = "Work"

[ratio]            # the records-to-product ratio (FM-032): `--ratio` counts these prefixes as records, every other path as product
records = ["work-tracker/"]
