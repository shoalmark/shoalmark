<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="12" height="12" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
<!-- the box, open at the corner the arrow leaves by -->
<rect x="0" y="2" width="4" height="1"/>
<rect x="0" y="3" width="1" height="8"/>
<rect x="9" y="8" width="1" height="3"/>
<rect x="0" y="11" width="10" height="1"/>
<!-- the arrow's head, at the top right -->
<rect x="6" y="0" width="6" height="1"/>
<rect x="11" y="1" width="1" height="5"/>
<!-- its shaft, from inside the box out through the corner -->
<rect x="10" y="1" width="1" height="1"/>
<rect x="9" y="2" width="1" height="1"/>
<rect x="8" y="3" width="1" height="1"/>
<rect x="7" y="4" width="1" height="1"/>
<rect x="6" y="5" width="1" height="1"/>
<rect x="5" y="6" width="1" height="1"/>
</svg>
