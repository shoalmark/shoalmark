<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="12" height="12" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
<!-- the long stroke, down from the right -->
<rect x="10" y="2" width="2" height="1"/>
<rect x="9" y="3" width="2" height="1"/>
<rect x="8" y="4" width="2" height="1"/>
<rect x="7" y="5" width="2" height="1"/>
<rect x="6" y="6" width="2" height="1"/>
<!-- the short stroke, and the foot they share -->
<rect x="1" y="5" width="2" height="1"/>
<rect x="2" y="6" width="2" height="1"/>
<rect x="3" y="7" width="4" height="1"/>
<rect x="4" y="8" width="2" height="1"/>
</svg>
