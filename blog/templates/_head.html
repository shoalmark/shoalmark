<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1720">
<title>{{ title_text }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<link rel="icon" href="{{ site_root }}favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="{{ site_root }}assets/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="stylesheet" href="{{ root }}assets/blog.css">
<link rel="alternate" type="application/rss+xml" title="shoalmark blog" href="{{ root }}feed.xml">
<meta property="og:site_name" content="shoalmark">
<meta property="og:locale" content="en_GB">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:title" content="{{ title_text }}">
<meta property="og:description" content="{{ description }}">
