# The documentation site — Zensical (https://zensical.org), the same TOML shape as shoalmark.toml.
# Two audiences, one source: human pages live here; the agents' document is README.md, rendered, never copied.
[project]
site_url = "https://shoalmark.tools/"
site_name = "shoalmark"
site_description = "A workbench for your agents. Your decisions on record."
repo_url = "https://github.com/shoalmark/shoalmark"
repo_name = "shoalmark/shoalmark"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/fonts.css", "stylesheets/shoalmark.css"]
use_directory_urls = false   # links are `setup.html`, not `setup/` — the built site opens from the file system too

nav = [
  { "Start" = "index.md" },
  { "Why shoalmark?" = "why-shoalmark.md" },
  { "How it works" = "how-it-works.md" },
  { "Set up in ten minutes" = "setup.md" },
  { "Your answer is your commit" = "signing.md" },
  { "Your word in TRIAGE.md" = "triage.md" },
  { "The standup" = "standup.md" },
  { "Requirements" = "requirements.md" },
  { "The seats" = "seats/index.md" },
  { "For agents — the contract" = "agents/README.md" },
  { "Deutsch" = [
    { "Start" = "de/index.md" },
    { "Warum shoalmark?" = "de/warum-shoalmark.md" },
    { "So funktioniert's" = "de/how-it-works.md" },
    { "In zehn Minuten eingerichtet" = "de/setup.md" },
    { "Deine Antwort ist dein Commit" = "de/signing.md" },
    { "Dein Wort in der TRIAGE.md" = "de/triage.md" },
    { "Das Stand-up" = "de/standup.md" },
    { "Anforderungen" = "de/requirements.md" },
  ] },
]

# The launch state. `probe = false`: the primary button hands the agents the note (ADOPT.md) and no probe prompt is built. `probe = true`: the button copies
# the probe prompt and opens its dialog, and probe.txt and de/probe.txt are written. "How it works" says which, in both languages, from the folder named below
# in `base_path`, interim or probe: turn both when turning the switch (a check in test_shoalmark.py refuses a build where they disagree).
[project.extra]
probe = true

[project.theme]
font = false
language = "en"
custom_dir = "overrides"   # .icons/shoalmark/pricke.svg: the logo inlined, so it takes the scheme's colour
favicon = "favicon.ico"
features = ["content.code.copy", "content.action.edit", "navigation.footer", "navigation.indexes", "navigation.sections", "navigation.top", "search.highlight", "search.suggest", "toc.follow"]

[project.theme.icon]
logo = "shoalmark/pricke"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

# Render the agents’ contract from the root README, and "How it works" with the words of the launch state named in `base_path`; missing includes fail the build.
[project.markdown_extensions]
# Once this table is set, Zensical builds with none of its default extensions but toc and tables, so each other one the pages need is named here.
# Fenced code first: a block in a list item, or with a blank line in it, is still one code block.
pymdownx.superfences = {}
pymdownx.snippets.check_paths = true
pymdownx.snippets.base_path = [".", "launch/probe"]
