# The documentation site — Zensical (https://zensical.org), the same TOML shape as shoalmark.toml.
# Two audiences, one source: human pages live here; the agents' document is README.md, rendered, never copied.
[project]
site_url = "https://shoalmark.github.io/shoalmark/"
site_name = "shoalmark"
site_description = "Get a better-performing human Owner — a work tracker that puts what needs the Owner first."
repo_url = "https://github.com/shoalmark/shoalmark"
repo_name = "shoalmark/shoalmark"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/fonts.css", "stylesheets/shoalmark.css"]
use_directory_urls = false   # links are `setup.html`, not `setup/` — the built site opens from the file system too

nav = [
  { "Start" = "index.md" },
  { "Set up in ten minutes" = "setup.md" },
  { "Your answer is your commit" = "signing.md" },
  { "Your word in TRIAGE.md" = "triage.md" },
  { "The standup" = "standup.md" },
  { "Requirements" = "requirements.md" },
  { "The seats" = "seats/index.md" },
  { "For agents — the contract" = "agents/README.md" },
  { "Deutsch" = [
    { "Start" = "de/index.md" },
    { "In zehn Minuten eingerichtet" = "de/setup.md" },
    { "Ihre Antwort ist Ihr Commit" = "de/signing.md" },
    { "Ihr Wort in der TRIAGE.md" = "de/triage.md" },
    { "Der Standup" = "de/standup.md" },
    { "Anforderungen" = "de/requirements.md" },
  ] },
]

[project.theme]
font = false
language = "en"
custom_dir = "overrides"   # .icons/shoalmark/pricke.svg: the logo inlined, so it takes the scheme's colour
favicon = "assets/favicon.svg"
features = ["content.code.copy", "content.action.edit", "navigation.footer", "navigation.indexes", "navigation.sections", "navigation.top", "search.highlight", "search.suggest", "toc.follow"]

[project.theme.icon]
logo = "shoalmark/pricke"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

# Render the agents’ contract from the root README; missing includes fail the build.
[project.markdown_extensions]
pymdownx.snippets.check_paths = true
